plugins {
    id 'dev.kikugie.stonecutter'
    id 'net.fabricmc.fabric-loom-remap' apply false
    id 'net.fabricmc.fabric-loom' apply false
}

// The version whose code is active in src/. The "Set active project to ..." tasks rewrite this line.
stonecutter.active '26.3'

// Every version's release jar in one folder: build/libs/.
tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Builds the mod for every Minecraft version and copies the jars to build/libs.'
    subprojects.each { node ->
        dependsOn "${node.path}:releaseJar"
        from(node.layout.buildDirectory.dir('libs')) {
            include 'mcflow-client-*.jar'
            exclude '*-sources.jar', '*-dev.jar'
        }
    }
    into layout.buildDirectory.dir('libs')
}
