// Built once per Minecraft version (Stonecutter node). The node's version is stonecutter.current.version.

def versionProperties = new Properties()
rootProject.file("versions/${stonecutter.current.project}/gradle.properties").withInputStream { versionProperties.load(it) }
versionProperties.each { key, value -> project.ext.set(key, value) }

// Minecraft is obfuscated up to 1.21.11 and unobfuscated from 26.1 on.
def unobfuscated = stonecutter.eval(stonecutter.current.version, '>=26.1')
def javaVersion = (project.java_version as String).toInteger()

apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

group = rootProject.maven_group
version = "${rootProject.mod_version}+${project.minecraft_version}"
base { archivesName = 'mcflow-client' }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (unobfuscated) {
        implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    } else {
        // Mojang's names in source, remapped to Fabric's runtime names in the release jar.
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    }
}

processResources {
    def props = [
        version        : project.version,
        minecraft_range: project.minecraft_range,
        java_version   : javaVersion,
        loader_version : rootProject.fabric_loader_minimum,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

// The jar players install: remapped on obfuscated versions, the plain jar on unobfuscated ones.
tasks.register('releaseJar') {
    group = 'build'
    dependsOn unobfuscated ? 'jar' : 'remapJar'
}
