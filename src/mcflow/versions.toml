# Every third-party version mcflow depends on, verified against official sources.
# Sources and dates: docs/research/Stage 1 Toolchain and Version Pins.md
# Change a pin only after checking the tool's current docs, and update that research doc too.

[paper]
# Oldest Paper version mcflow supports (project decision, 2026-11-14).
minimum_version = "1.17"
fill_api = "https://fill.papermc.io/v3/projects/paper/versions"
# Lowest LTS release recommended when a Paper version needs Java N.
java_lts = [17, 21, 25]

[node]
minimum_major = 22

[universal_ctags]
version_marker = "Universal Ctags"
rejected_marker = "Exuberant Ctags"

[universal_ctags.windows]
# Official Windows builds (github.com/universal-ctags/ctags-win32). `mcflow tools install` uses it;
# on macOS and Linux it comes from the package manager.
version = "p6.2.20261011.0"
url = "https://github.com/universal-ctags/ctags-win32/releases/download/p6.2.20261011.0/ctags-p6.2.20261011.0-x64.zip"
sha256 = "2d20e0fb8149e64c6e77d3806a2e56f4d0d0ca5ea20d1b354b26c1d5637a0397"
license = "GPL-2.0"

[toktoken]
version = "0.5.0"
repo = "mauriziofonte/toktoken"
license = "AGPL-3.0"
release_url = "https://github.com/mauriziofonte/toktoken/releases/download/v0.5.0/"

# platform key = "<os>-<machine>" as normalised by mcflow.platforms
[toktoken.assets]
"linux-x86_64" = { file = "toktoken-linux-x86_64", sha256 = "cbc4c5bacdf455c8eb9ebe16b69687e908b97c372786ba0fb7fecb027e49fcde" }
"linux-aarch64" = { file = "toktoken-linux-aarch64", sha256 = "fef145b6f3ddff3aec4ba7ec4cb85641023a8329fe7317e952a59ee68a647bc8" }
"linux-armv7" = { file = "toktoken-linux-armv7", sha256 = "57ff68245067000df89a40ac4b0a7c80aaf81a3617385f6c56cf97460f9478c1" }
"macos-x86_64" = { file = "toktoken-macos-x86_64", sha256 = "5ac1b9c18f6f5f9d21325f9f4e24518fbafb525134200e846fd7d0b85ece8333" }
"macos-aarch64" = { file = "toktoken-macos-aarch64", sha256 = "0aa45d6763e1208e591dbf8ae8318bb08121dd508eb3a2b53d82378bc088407f" }
"windows-x86_64" = { file = "toktoken-win-x86_64.exe", sha256 = "4c01fc57b41a99dde533076ebc0b43acdc894c9b246426715b2a8259a1d187ca" }

[viaversion]
# Hangar (PaperMC's official plugin repository), Release channel
version = "5.12.2"
url = "https://hangarcdn.papermc.io/plugins/ViaVersion/ViaVersion/versions/5.12.2/PAPER/ViaVersion-5.12.2.jar"
sha256 = "c0b63badcb0f7d38f4443e06820f2b8142dd4f0d3b0511f9330ff1050430e6b2"
minimum_java = 17

[viabackwards]
# Hangar Release channel. Lets older clients join a newer server: mcflow's test bots speak mineflayer's newest
# version (below), so they need it whenever the server is newer than that.
version = "5.12.2"
url = "https://hangarcdn.papermc.io/plugins/ViaVersion/ViaBackwards/versions/5.12.2/PAPER/ViaBackwards-5.12.2.jar"
sha256 = "e989440e0aad7e12d4685d7a57df854691b67660966a95ec0450e20ce98e87ab"

[bots]
# Keep in step with mcp-server's mineflayer pin (4.39.0): its newest supported Minecraft version.
mineflayer = "4.39.0"
mineflayer_latest = "26.1"

[fabric]
# Official Fabric installer (maven.fabricmc.net); SHA-256 matches the maven's own .sha256 file.
installer_version = "1.1.2"
installer_url = "https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.2/fabric-installer-1.1.2.jar"
installer_sha256 = "61e035bf7bf70153e127440ce34de47c9036f0a2d0c65d1529454bd35ceefe4f"
loader_version = "0.20.1"

[client_mod]
# mcflow's own Fabric client mod (client-mod/ in this repo). Users must install it.
version = "0.1.0"
minecraft_versions = [
  "1.17",
  "1.17.1",
  "1.18",
  "1.18.1",
  "1.18.2",
  "1.19",
  "1.19.1",
  "1.19.2",
  "1.19.3",
  "1.19.4",
  "1.20",
  "1.20.1",
  "1.20.2",
  "1.20.4",
  "1.20.5",
  "1.20.6",
  "1.21",
  "1.21.1",
  "1.21.3",
  "1.21.4",
  "1.21.5",
  "1.21.6",
  "1.21.7",
  "1.21.8",
  "1.21.9",
  "1.21.10",
  "1.21.11",
  "26.1.1",
  "26.1.2",
  "26.2",
  "26.3",
]
# Filled in when the mod is released on GitHub; until then install a local build with --jar.
release_url = ""
sha256 = {}

[mcflow_server]
# mcflow's MCP server (mcp-server/ in this repo), shipped as a tarball on the runtime release.
# Empty until the first runtime release is pinned with scripts/pin_runtime.py; until then
# `mcflow init` leaves it out of .mcp.json.
version = ""
tarball_url = ""
sha256 = ""

[humanizer]
repo = "blader/humanizer"
commit = "b48c832f0f809c1b5658edbb838c2521b72f2413"
license = "MIT"
# Release 4.0.0 (2026-11-10). Vendored in templates/project/.claude/skills/humanizer/ with its
# LICENSE; tests check the copies against these sums.
version = "4.0.0"
skill_sha256 = "804a119e924ac30295b298213e0b71b3e38b2667b8ef4fb7b69e9246369b9045"
license_sha256 = "4ac4810254ab36d45419141aeb8e69bf50652cfafe5b2dab947d06d44e5cbf96"

[knowledge]
default_repo = "LadonON/mcflow-knowledge"
