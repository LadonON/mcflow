# Releases the mcflow Python package on GitHub. There's no PyPI release: users install with pipx
# straight from this repo, pinned to the tag:
#
#   pipx install git+https://github.com/LadonON/mcflow.git@v<version>
#
#   push a tag v<version>  ->  the full CI suite, release checks, build, then a DRAFT GitHub release
#                              with the wheel and sdist attached (a human publishes it)
#   run manually           ->  CI, checks and build only, as a workflow artifact
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the job that creates the release gets write access.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Release checks
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/check_release.py "$TAG"
      - name: Build wheel and sdist
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel with pipx and run it
        run: |
          python -m pip install pipx
          python -m pipx install dist/*.whl
          mcflow --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  draft-release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: this job runs no repository code, it only uploads the files built above.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "mcflow ${GITHUB_REF_NAME#v}" \
            --notes "Install: pipx install git+https://github.com/${GITHUB_REPOSITORY}.git@${GITHUB_REF_NAME}"
