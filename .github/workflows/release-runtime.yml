# Builds the parts of mcflow that run outside Python: the Fabric client mod (every supported Minecraft
# version) and the mcflow-server tarball, with SHA256SUMS.
#
#   push a tag runtime-v<version>   ->  the full CI suite, then a DRAFT GitHub release with all files
#                                       (a human publishes it)
#   run manually (workflow_dispatch) ->  CI and the same files as a workflow artifact only, nothing released
#
# After publishing, run `python scripts/pin_runtime.py runtime-v<version>` to pin the checksums in
# src/mcflow/versions.toml, so the Python package only ever installs files it has checksums for.
name: Release runtime

on:
  push:
    tags: ["runtime-v*"]
  workflow_dispatch:

# Read-only by default; only the job that creates the release gets write access.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  plan:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      slices: ${{ steps.plan.outputs.slices }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        run: |
          slices=$(ls client-mod/versions | sort -V | python3 -c "
          import json, sys
          v = [l.strip() for l in sys.stdin if l.strip()]
          print(json.dumps([','.join(v[i:i + 6]) for i in range(0, len(v), 6)]))")
          echo "slices=$slices" >> "$GITHUB_OUTPUT"

  client-mod:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        versions: ${{ fromJSON(needs.plan.outputs.slices) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - working-directory: client-mod
        run: ./gradlew collectJars --console=plain -Pmcflow.versions=${{ matrix.versions }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-${{ strategy.job-index }}
          path: client-mod/build/libs/*.jar

  mcp-server:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - working-directory: mcp-server
        run: |
          npm ci
          npm test
          npm run build
          npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-server
          path: mcp-server/mcflow-server-*.tgz

  assemble:
    needs: [client-mod, mcp-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Only this workflow's own build outputs: the CI jobs above upload artifacts too.
          pattern: mod-*
          path: parts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-server
          path: parts/mcp-server
      - name: Collect files and checksums
        run: |
          mkdir dist
          # Every slice also builds 26.3 (the source version); the copies are identical, keep one.
          find parts -type f \( -name '*.jar' -o -name '*.tgz' \) -exec cp -n {} dist/ \;
          expected=$(ls client-mod/versions | wc -l)
          built=$(ls dist/mcflow-client-*.jar | wc -l)
          if [ "$built" -ne "$expected" ]; then
            echo "Built $built mod jars but client-mod/versions has $expected versions" >&2
            exit 1
          fi
          cd dist
          sha256sum * | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-release
          path: dist/*

  draft-release:
    needs: assemble
    if: startsWith(github.ref, 'refs/tags/runtime-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: this job runs no repository code, it only uploads the files assembled above.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-release
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "mcflow runtime ${GITHUB_REF_NAME#runtime-v}" \
            --notes "Fabric client mod for every supported Minecraft version, and mcflow-server. Checksums in SHA256SUMS."
