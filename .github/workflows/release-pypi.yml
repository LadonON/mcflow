# Publishes mcflow-cli to PyPI with trusted publishing (GitHub Actions OIDC): no API token is stored.
#
#   push a tag v<version>  ->  build, check, then publish (the `pypi` environment can require approval)
#   run manually           ->  build and check only; nothing is published
#
# One-time setup on pypi.org (the project owner): add a pending trusted publisher for project
# `mcflow-cli`, owner LadonON, repository mcflow, workflow release-pypi.yml, environment pypi.
name: Release to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Release checks
        run: python scripts/check_release.py "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcflow-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
