name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Unit tests
        run: python -m pytest

  package:
    name: pipx install smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install build pipx
          python -m build --wheel
      - name: Install with pipx and run init + doctor
        shell: bash
        run: |
          python -m pipx install dist/*.whl
          export PATH="$HOME/.local/bin:$PATH"
          mcflow --version
          mcflow init "$RUNNER_TEMP/demo" --paper-version latest
          test -f "$RUNNER_TEMP/demo/CLAUDE.md"
          test -f "$RUNNER_TEMP/demo/.claude/skills/.gitkeep"
          cd "$RUNNER_TEMP/demo"
          # doctor exits 1 when tools are missing on the runner; we only need it to run cleanly
          mcflow doctor --json > doctor.json || [ $? -eq 1 ]
          python -c "import json; print(len(json.load(open('doctor.json'))), 'checks ran')"
