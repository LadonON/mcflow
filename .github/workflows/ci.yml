name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflows call this before building anything, so a tag can't ship untested code.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # universal-ctags, so the real-ctags tests run (macOS ships BSD ctags, Windows runners Exuberant)
      - name: universal-ctags (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y universal-ctags
      - name: universal-ctags (macOS)
        if: runner.os == 'macOS'
        run: brew install universal-ctags
      - name: universal-ctags (Windows, through mcflow tools install)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mcflow tools install --dir "$RUNNER_TEMP/mcflow-bin"
          echo "$RUNNER_TEMP/mcflow-bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Unit tests
        run: python -m pytest

  mcp-server:
    name: mcflow-server / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  client-mod-plan:
    name: Fabric client mod / plan slices
    runs-on: ubuntu-latest
    outputs:
      slices: ${{ steps.plan.outputs.slices }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        # Every folder in client-mod/versions/ is a supported version. Six per job keeps each runner's
        # disk use (Loom processes every configured Minecraft version) well within limits.
        run: |
          slices=$(ls client-mod/versions | sort -V | python3 -c "
          import json, sys
          v = [l.strip() for l in sys.stdin if l.strip()]
          print(json.dumps([','.join(v[i:i + 6]) for i in range(0, len(v), 6)]))")
          echo "slices=$slices" >> "$GITHUB_OUTPUT"
          echo "$slices"

  client-mod:
    name: Fabric client mod / ${{ matrix.versions }}
    needs: client-mod-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versions: ${{ fromJSON(needs.client-mod-plan.outputs.slices) }}
    defaults:
      run:
        working-directory: client-mod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - run: ./gradlew collectJars --continue --console=plain -Pmcflow.versions=${{ matrix.versions }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcflow-client-jars-${{ strategy.job-index }}
          path: client-mod/build/libs/*.jar

  integration:
    # Task 7.1: the installed package end to end on each OS. pipx install, tools install, init,
    # doctor, server setup on a real Paper jar, then server control and a bot through mcflow-server.
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PAPER_VERSION: "1.21.11"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build the wheel and install it with pipx
        run: |
          python -m pip install build pipx
          python -m build --wheel
          python -m pipx install dist/*.whl
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: mcflow tools install
        run: |
          mcflow --version
          mcflow tools install --dir "$RUNNER_TEMP/mcflow-bin"
          echo "$RUNNER_TEMP/mcflow-bin" >> "$GITHUB_PATH"
      - name: universal-ctags (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y universal-ctags
      - name: universal-ctags (macOS)
        if: runner.os == 'macOS'
        run: brew install universal-ctags
      - name: mcflow init
        run: |
          mcflow init "$RUNNER_TEMP/demo" --paper-version "$PAPER_VERSION"
          test -f "$RUNNER_TEMP/demo/CLAUDE.md"
          test -f "$RUNNER_TEMP/demo/.claude/skills/knowledge/SKILL.md"
          test -f "$RUNNER_TEMP/demo/.mcflow/managed.json"
      - name: Paper jar, then mcflow server setup
        # This test server belongs to the project's own CI; the EULA is accepted for it here.
        run: |
          python scripts/ci_fetch_paper.py "$PAPER_VERSION" "$RUNNER_TEMP/demo/server"
          cd "$RUNNER_TEMP/demo"
          mcflow server setup --accept-eula
      - name: mcflow doctor
        run: |
          cd "$RUNNER_TEMP/demo"
          # Claude Code and the client mod aren't on runners, so doctor exits 1; check the rest
          mcflow doctor --json > doctor.json || [ $? -eq 1 ]
          python - <<'EOF'
          import json
          checks = {c["name"]: c for c in json.load(open("doctor.json"))}
          for c in checks.values():
              print(f"{c['status']:5} {c['name']}: {c['summary']}")
          must_pass = ["Platform", "Java", "Node.js", "universal-ctags", "TokToken", "git", "Test bots"]
          bad = [n for n in must_pass if checks.get(n, {}).get("status") != "ok"]
          # PaperMC only supports its newest version, so an older one is a warning, never a failure
          if checks.get("Paper version", {}).get("status") not in ("ok", "warn"):
              bad.append("Paper version")
          assert not bad, f"expected ok: {bad}"
          EOF
      - name: mcflow update and kb validate
        run: |
          cd "$RUNNER_TEMP/demo"
          mcflow update --no-kb | tee update.txt
          grep -q "0 change(s)" update.txt
          mcflow kb validate
      - name: Server control and a test bot through mcflow-server
        working-directory: mcp-server
        run: |
          npm ci
          npm run build
          node scripts/integration.mjs "$RUNNER_TEMP/demo"
      - name: Server log on failure
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/demo/server/logs/latest.log" || true
