name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Unit tests
        run: python -m pytest

  mcp-server:
    name: mcflow-server / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  client-mod-plan:
    name: Fabric client mod / plan slices
    runs-on: ubuntu-latest
    outputs:
      slices: ${{ steps.plan.outputs.slices }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        # Every folder in client-mod/versions/ is a supported version. Six per job keeps each runner's
        # disk use (Loom processes every configured Minecraft version) well within limits.
        run: |
          slices=$(ls client-mod/versions | sort -V | python3 -c "
          import json, sys
          v = [l.strip() for l in sys.stdin if l.strip()]
          print(json.dumps([','.join(v[i:i + 6]) for i in range(0, len(v), 6)]))")
          echo "slices=$slices" >> "$GITHUB_OUTPUT"
          echo "$slices"

  client-mod:
    name: Fabric client mod / ${{ matrix.versions }}
    needs: client-mod-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versions: ${{ fromJSON(needs.client-mod-plan.outputs.slices) }}
    defaults:
      run:
        working-directory: client-mod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - run: ./gradlew collectJars --console=plain -Pmcflow.versions=${{ matrix.versions }}
      - uses: actions/upload-artifact@v7
        with:
          name: mcflow-client-jars-${{ strategy.job-index }}
          path: client-mod/build/libs/*.jar

  package:
    name: pipx install smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install build pipx
          python -m build --wheel
      - name: Install with pipx and run init + doctor
        shell: bash
        run: |
          python -m pipx install dist/*.whl
          export PATH="$HOME/.local/bin:$PATH"
          mcflow --version
          mcflow init "$RUNNER_TEMP/demo" --paper-version latest
          test -f "$RUNNER_TEMP/demo/CLAUDE.md"
          test -f "$RUNNER_TEMP/demo/.claude/skills/.gitkeep"
          cd "$RUNNER_TEMP/demo"
          # doctor exits 1 when tools are missing on the runner; we only need it to run cleanly
          mcflow doctor --json > doctor.json || [ $? -eq 1 ]
          python -c "import json; print(len(json.load(open('doctor.json'))), 'checks ran')"
